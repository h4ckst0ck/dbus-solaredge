; Configuration of dbus-solaredge. Copy this file to config.ini and adapt it.
; All options are optional, the values below are the defaults.

[modbus]
; IP address of the SolarEdge inverter (Modbus TCP must be enabled in SetApp)
host = 192.168.178.80
port = 502
; SetApp: Communication -> RS485 -> Protocol -> SunSpec (Non-SE Logger) -> Device ID
unit = 126
; timeout of one Modbus request in seconds
timeout = 2.0

[inverter]
; max power of the inverter in W, 0 = read it from the inverter (register 0xF304)
max_power = 0
; offer /Ac/PowerLimit for the ESS zero feed-in (Settings -> ESS -> Grid feed-in)
power_limit = yes
; the inverter falls back to 100 % when no limit is written within this time (30..600 s)
power_limit_timeout = 120
; publish a digital input which is active while the inverter is throttled
throttle_input = no

[driver]
; update interval in seconds
update_interval = 1.0
; exit when the inverter is not reachable for this many seconds (daemontools restarts the driver)
fail_timeout = 10
